<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reset-button</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 720px;
      padding: 32px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    h1 {
      margin-bottom: 16px;
      font-size: 2.5rem;
    }
    p {
      margin: 0;
      line-height: 1.75;
      color: #4b5563;
    }
    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      border-radius: 9999px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>reset-button</h1>
    <p>A privacy-first AI support tool that helps people find their next step when life feels overwhelming.</p>
    <a href="README.md">View Project README</a>
  </div>
</body>
</html>
