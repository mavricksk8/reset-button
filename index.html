<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Button</title>
  <style>
    :root {
      --bg1: #071827;
      --bg2: #12394a;
      --glass: rgba(255,255,255,.13);
      --glass2: rgba(255,255,255,.2);
      --text: #f6fbff;
      --soft: rgba(246,251,255,.78);
      --green: #8ef0b0;
      --gold: #ffd38a;
      --red: #ff5c5c;
      --shadow: 0 24px 70px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      overflow-x: hidden;
      background: linear-gradient(145deg, var(--bg1), var(--bg2));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,211,138,.28), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(142,240,176,.18), transparent 28%),
        radial-gradient(circle at 50% 90%, rgba(255,92,92,.14), transparent 30%),
        linear-gradient(180deg, rgba(5,12,22,.2), rgba(5,12,22,.68));
      animation: breathe 10s ease-in-out infinite alternate;
      z-index: -3;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(rgba(255,255,255,.28) 1px, transparent 1px),
        radial-gradient(rgba(255,255,255,.14) 1px, transparent 1px);
      background-size: 80px 80px, 130px 130px;
      background-position: 0 0, 30px 50px;
      opacity: .33;
      animation: drift 28s linear infinite;
      z-index: -2;
    }

    @keyframes breathe {
      from { filter: saturate(1) brightness(.95); }
      to { filter: saturate(1.25) brightness(1.08); }
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-90px); }
    }

    .mountains {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34vh;
      z-index: -1;
      opacity: .9;
      background:
        linear-gradient(135deg, transparent 0 48%, rgba(2,9,15,.72) 49% 100%) left bottom / 55% 70% no-repeat,
        linear-gradient(225deg, transparent 0 48%, rgba(2,9,15,.83) 49% 100%) right bottom / 62% 82% no-repeat,
        linear-gradient(170deg, transparent 0 52%, rgba(2,9,15,.62) 53% 100%) center bottom / 95% 55% no-repeat;
    }

    .app {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      padding: clamp(26px, 5vw, 54px);
      border: 1px solid rgba(255,255,255,.22);
      background: linear-gradient(135deg, var(--glass), rgba(255,255,255,.07));
      box-shadow: var(--shadow);
      border-radius: 34px;
      backdrop-filter: blur(22px);
      text-align: center;
      animation: rise .7s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .seed {
      font-size: 4rem;
      margin-bottom: 12px;
      animation: sway 3s ease-in-out infinite;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.25));
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-3deg) translateY(0); }
      50% { transform: rotate(3deg) translateY(-5px); }
    }

    .eyebrow {
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--green);
      font-weight: 800;
      font-size: .8rem;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.5rem, 8vw, 5.3rem);
      line-height: .92;
    }

    h2 {
      margin: 0 0 18px;
      font-size: clamp(1.8rem, 5vw, 3.1rem);
      line-height: 1;
    }

    p {
      color: var(--soft);
      line-height: 1.65;
      font-size: clamp(1.02rem, 2.3vw, 1.28rem);
      margin: 0 auto 20px;
      max-width: 620px;
    }

    .quote {
      font-size: clamp(1.05rem, 2.4vw, 1.4rem);
      color: #fff;
      margin-top: 16px;
    }

    .buttons, .choices {
      display: grid;
      gap: 14px;
      margin-top: 28px;
    }

    .choices {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    button, .ai-link {
      border: 0;
      border-radius: 999px;
      padding: 16px 22px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      color: #06151c;
      background: linear-gradient(135deg, var(--green), #d7ffd9);
      box-shadow: 0 12px 28px rgba(0,0,0,.22);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover, .ai-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(0,0,0,.28);
      filter: brightness(1.04);
    }

    .choice {
      color: var(--text);
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.2);
      box-shadow: none;
      border-radius: 20px;
      min-height: 70px;
    }

    .choice:hover { background: rgba(255,255,255,.22); }

    .secondary {
      background: rgba(255,255,255,.12);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.2);
      box-shadow: none;
    }

    textarea, input {
      width: 100%;
      min-height: 120px;
      border-radius: 24px;
      padding: 18px;
      color: var(--text);
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.24);
      outline: none;
      resize: vertical;
      font: inherit;
      margin-top: 14px;
    }

    input { min-height: 58px; }

    textarea::placeholder, input::placeholder { color: rgba(255,255,255,.55); }

    .progress {
      height: 8px;
      background: rgba(255,255,255,.13);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 26px;
    }

    .bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--green), var(--gold));
      border-radius: 99px;
      transition: width .35s ease;
    }

    .plan {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 24px;
      text-align: left;
    }

    .plan-box {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 24px;
      padding: 18px;
    }

    .plan-box h3 { margin: 0 0 10px; }
    .plan-box ul { margin: 0; padding-left: 19px; color: var(--soft); line-height: 1.55; }

    .disclaimer {
      margin-top: 22px;
      font-size: .88rem;
      color: rgba(255,255,255,.58);
    }

    .hidden { display: none; }

    @media (max-width: 680px) {
      .choices, .plan { grid-template-columns: 1fr; }
      .card { border-radius: 26px; }
      .app { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="mountains"></div>
  <main class="app">
    <section class="card" id="screen"></section>
  </main>

  <script>
    const state = {
      feeling: "",
      heavy: "",
      need: "",
      win: ""
    };

    const screens = [
      {
        type: "home",
        seed: "🌱",
        eyebrow: "Reset Button",
        title: "When life feels overwhelming...",
        text: "You don't have to solve your whole life today.",
        quote: "Let's focus on just this moment. Then together we'll overcome the next one. The hours and days will take care of themselves.",
        button: "Begin Your Reset"
      },
      {
        type: "choice",
        key: "feeling",
        seed: "🌱",
        title: "First... how are you feeling right now?",
        text: "Take your time. There are no wrong answers.",
        choices: ["😊 I'm okay", "😕 I'm struggling", "😢 I'm overwhelmed", "😴 I'm exhausted", "😡 I'm frustrated", "😐 I don't even know"]
      },
      {
        type: "choice",
        key: "heavy",
        seed: "🌿",
        title: "What feels heaviest today?",
        text: "Pick the area that is taking up the most space in your mind.",
        choices: ["Money", "Mental health", "Physical health", "Relationships", "Family", "Housing", "Career", "Recovery", "Something else"]
      },
      {
        type: "text",
        key: "need",
        seed: "🌿",
        title: "What do you need most in this moment?",
        text: "A plan, rest, courage, a phone call, food, water, a boundary, a break... whatever is true.",
        placeholder: "Right now I need..."
      },
      {
        type: "text",
        key: "win",
        seed: "🌳",
        title: "What's one small win you would love to have in the next 24 hours?",
        text: "Small counts. Tiny counts. One next step counts.",
        placeholder: "One small win would be..."
      },
      { type: "result" }
    ];

    let step = 0;
    const screen = document.getElementById("screen");

    function progress() {
      if (step === 0) return "";
      const pct = Math.min(100, Math.round((step / (screens.length - 1)) * 100));
      return `<div class="progress"><div class="bar" style="width:${pct}%"></div></div>`;
    }

    function render() {
      const s = screens[step];
      screen.style.animation = "none";
      void screen.offsetWidth;
      screen.style.animation = "rise .7s ease both";

      if (s.type === "home") {
        screen.innerHTML = `
          <div class="seed">${s.seed}</div>
          <div class="eyebrow">${s.eyebrow}</div>
          <h1>${s.title}</h1>
          <p>${s.text}</p>
          <p class="quote">${s.quote}</p>
          <div class="buttons"><button onclick="next()">🌱 ${s.button}</button></div>
          <div class="disclaimer">This isn't therapy. This isn't judgment. It's simply a place to reset whenever you're ready.</div>
        `;
      }

      if (s.type === "choice") {
        screen.innerHTML = `
          ${progress()}
          <div class="seed">${s.seed}</div>
          <h2>${s.title}</h2>
          <p>${s.text}</p>
          <div class="choices">
            ${s.choices.map(c => `<button class="choice" onclick="choose('${s.key}', '${escapeChoice(c)}')">${c}</button>`).join("")}
          </div>
        `;
      }

      if (s.type === "text") {
        screen.innerHTML = `
          ${progress()}
          <div class="seed">${s.seed}</div>
          <h2>${s.title}</h2>
          <p>${s.text}</p>
          <textarea id="answer" placeholder="${s.placeholder}"></textarea>
          <div class="buttons">
            <button onclick="saveText('${s.key}')">Continue</button>
            <button class="secondary" onclick="skipText('${s.key}')">Skip for now</button>
          </div>
        `;
      }

      if (s.type === "result") renderResult();
    }

    function escapeChoice(str) {
      return str.replace(/'/g, "\\'");
    }

    function next() { step++; render(); }

    function choose(key, value) {
      state[key] = value;
      next();
    }

    function saveText(key) {
      const answer = document.getElementById("answer").value.trim();
      state[key] = answer || "Not sure yet";
      next();
    }

    function skipText(key) {
      state[key] = "Not sure yet";
      next();
    }

    function getTodaySteps() {
      const base = ["Drink some water.", "Take three slow breaths."];
      const heavy = state.heavy.toLowerCase();

      if (heavy.includes("money")) base.push("Write down the next bill or money task in front of you.");
      else if (heavy.includes("mental")) base.push("Text one safe person or step outside for two minutes.");
      else if (heavy.includes("physical")) base.push("Do one kind thing for your body: food, water, shower, stretch, or rest.");
      else if (heavy.includes("relationship") || heavy.includes("family")) base.push("Do not solve the whole relationship today. Write the one sentence you need to say clearly.");
      else if (heavy.includes("housing")) base.push("List the one housing call, document, or next action that matters most.");
      else if (heavy.includes("recovery")) base.push("Create distance from the trigger for the next hour and contact one safe support if possible.");
      else base.push("Pick one small action that would make the next hour easier.");

      return base;
    }

    function renderResult() {
      const today = getTodaySteps();
      const aiPrompt = encodeURIComponent(`I just completed a Reset Button check-in. Please help me make a kind, practical plan. Here is my context:\n\nFeeling: ${state.feeling}\nHeaviest area: ${state.heavy}\nWhat I need: ${state.need}\nSmall win I want: ${state.win}\n\nPlease help me focus on just this moment, then the next one.`);
      const aiUrl = `https://chat.openai.com/?q=${aiPrompt}`;

      screen.innerHTML = `
        ${progress()}
        <div class="seed">🌳</div>
        <div class="eyebrow">Your Reset Begins</div>
        <h2>Your seed has been planted.</h2>
        <p>You don't have to grow the whole tree today. Just keep watering the next small step.</p>
        <div class="plan">
          <div class="plan-box">
            <h3>🌞 Today</h3>
            <ul>${today.map(x => `<li>${x}</li>`).join("")}</ul>
          </div>
          <div class="plan-box">
            <h3>🌅 This Week</h3>
            <ul>
              <li>Choose one problem to simplify.</li>
              <li>Make one important call or message.</li>
              <li>Schedule one moment of peace.</li>
            </ul>
          </div>
          <div class="plan-box">
            <h3>🌳 This Month</h3>
            <ul>
              <li>Build one routine that supports you.</li>
              <li>Finish one important project or repair.</li>
              <li>Celebrate progress, even if it is messy.</li>
            </ul>
          </div>
        </div>
        <div class="buttons">
          <a class="ai-link" href="${aiUrl}" target="_blank" rel="noopener">🤖 Continue with AI Support</a>
          <button class="secondary" onclick="restart()">Start Another Reset</button>
        </div>
        <div class="disclaimer">If you may hurt yourself or someone else, call emergency services or a local crisis line now. You matter too much to face that moment alone.</div>
      `;
    }

    function restart() {
      state.feeling = "";
      state.heavy = "";
      state.need = "";
      state.win = "";
      step = 0;
      render();
    }

    render();
  </script><script src="questions.js"></script>
<script src="script.js"></script>
</body>
</html>
